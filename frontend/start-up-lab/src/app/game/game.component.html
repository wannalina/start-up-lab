<div class="game-container" [ngClass]="currentStory.layout">
  <!-- Image on the left -->
  <div class="story-image" *ngIf="currentStory.image">
    <img [src]="currentStory.image" alt="Story Image" />
  </div>

  <!-- Text and choices on the right -->
  <div class="story-content">
    <p *ngIf="currentStory.text">{{ currentStory.text }}</p>

    <div class="choices" *ngIf="currentStory.choices">
      <button *ngFor="let choice of currentStory.choices" (click)="makeChoice(choice, choice.next)">
        {{ choice.text }}
      </button>
    </div>
  </div>
</div>
