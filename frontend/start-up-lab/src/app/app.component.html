<style>
  @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');

  * {
    font-family: 'Roboto', sans-serif;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  .navbar {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    background-color: #f8f9fa;
    padding: 10px 20px;
    flex-wrap: wrap;
    width: 100%;
    z-index: 1000; /* Ensure it stays above other content */
  }

  .navbar img {
    height: 30px;
    margin-right: 15px;
  }

  .navbar-list {
    display: flex;
    list-style: none;
    margin: 0;
    padding: 0;
    flex-direction: row; /* Default layout for larger screens */
    width: auto; /* Allow the list to take its natural width */
  }

  .navbar-item {
    margin: 0 15px; /* Add spacing between menu items */
  }

  .navbar-link {
    text-decoration: none;
    color: #7c7aac;
    font-weight: bold;
  }

  .navbar-link:hover {
    text-decoration: underline;
  }

  .login-button {
    display: block; /* Hide the login button by default */
    padding: 5px 15px;
    background-color: #7c7aac;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    margin-left: auto;
  }

  .login-button:hover {
    background-color: #5a588f;
  }

  .menu-toggle {
    display: none; /* Hide the menu toggle button by default */
    background-color: #7c7aac;
    color: white;
    border: none;
    padding: 10px;
    width: 40px;
    height: 40px;
    border-radius: 5px;
    cursor: pointer;
  }

  .menu-toggle:hover {
    background-color: #5a588f;
  }

  .user-actions {
    display: flex;
    align-items: center;
    margin-left: auto;
  }

  .username-text {
    color: #7c7aac; /* Purple color like other menu items */
    font-weight: bold;
    margin-right: 15px;
  }

  .logout-button {
    padding: 5px 15px;
    background-color: #ff4d4d;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: bold;
    transition: background-color 0.3s ease;
  }

  .logout-button:hover {
    background-color: #e60000;
  }

  .logout-button.responsive {
    display: none; /* Hide logout button by default on smaller screens */
    margin-left: auto;
    margin-top: 10px;
    padding: 5px 15px;
    background-color: #ff4d4d;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: bold;
  }

  .logout-button.responsive:hover {
    background-color: #e60000;
  }

  .username-text.small-screen {
      display: none;
    }

  /* Responsive Design */
  @media (max-width: 768px) { /* For iPads and smaller devices */
    .navbar {
      position: fixed; /* Make the navbar fixed only for iPads and smaller devices */
      top: 0;
      left: 0;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); /* Add a subtle shadow */
    }

    .navbar-list {
      flex-direction: column; /* Stack items vertically */
      width: 100%;
      max-height: 0; /* Initially hidden */
      overflow: hidden; /* Hide overflowing content */
      transition: max-height 0.3s ease-in-out; /* Smooth transition */
    }

    .navbar-list.show {
      max-height: 300px; /* Adjust based on the number of items */
    }

    .navbar-item {
      margin: 10px 0;
    }

    .menu-toggle {
      display: block; /* Show the toggle button */
      margin-left: auto;
    }

    .login-button {
      display: none; /* Hide the login button by default */
      align-self: flex-start;
      margin-top: 10px;
      margin-left: 0;
    }

    .login-button.show {
      display: block; /* Show the login button when the menu is open */
    }

    .logout-button {
      display: none; /* Hide logout button on iPads and smaller devices */
    }

    .logout-button.responsive {
      display: none;/* Hide logout button by default */
      align-self: flex-start;
      margin-top: 10px;
      margin-left: 0;
    }

    .logout-button.responsive.show {
      display: block; /* Show logout button when the menu is open */
    }

    .username-text {
      display: none; /* Hide default username text */
    }

    .username-text.small-screen {
      display: inline-block; /* Show username text for smaller devices */
      margin-right: auto; /* Move it to the left */
      font-size: 0.9rem;
    }
  }

  @media (max-width: 480px) { /* For iPhones and smaller devices */
    .navbar {
      padding: 10px;
    }

    .navbar img {
      height: 25px;
    }

    .navbar-link {
      font-size: 0.9rem;
    }

    .login-button {
      font-size: 0.9rem;
      padding: 5px 10px;
    }

    .logout-button.responsive {
      font-size: 0.9rem;
      padding: 5px 10px;
    }

    .username-text.small-screen {
      font-size: 0.8rem; /* Slightly smaller font for iPhones */
    }
  }
</style>

<main class="main">
  <div class="content">
    <div class="left-side">
      <nav class="navbar">
        <a href="home">
          <img src="assets/logo/logo.jpg" alt="Logo" style="height: 30px; margin-right: 15px;">
        </a>

        <!-- Hello {username} for smaller devices -->
        <span
          class="username-text small-screen"
          *ngIf="isLoggedIn"
          (click)="profileClicked()"
        >
          <u>{{ username }}</u>
        </span>

        <button class="menu-toggle" (click)="toggleMenu()">☰</button>

        <ul class="navbar-list" [class.show]="menuOpen">
          <li class="navbar-item"><a href="home" class="navbar-link">Home</a></li>
          <li class="navbar-item"><a href="aboutus" class="navbar-link">About</a></li>
          <li class="navbar-item"><a href="services" class="navbar-link">Services</a></li>
          <li class="navbar-item"><a href="contactus" class="navbar-link">Contact</a></li>
        </ul>

        <!-- User actions for larger screens -->
        <div class="user-actions" *ngIf="isLoggedIn">
           <span
            class="username-text"
            (click)="profileClicked()"
            style="cursor: pointer;"
          >
            <u>Hello, {{ username }}</u>
          </span>
          <button class="logout-button" (click)="onLogout()">Logout</button>
        </div>

        <!-- Login button for non-logged-in users -->
        <a
          *ngIf="!isLoggedIn"
          [class.show]="menuOpen"
          [href]="'login'"
          class="login-button"
        >
          Login
        </a>

        <button
        *ngIf="isLoggedIn"
        [class.show]="menuOpen"
        class="logout-button responsive"
        (click)="onLogout()"
        >
          Logout
        </button>
      </nav>
    </div>
  </div>
</main>
