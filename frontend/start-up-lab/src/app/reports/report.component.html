<div class="report-container">
    <div class="overview-container">
        <p>{{ report.overview }}</p>
    </div>
    <div class="traits-container">
        <ul>
            <li *ngFor="let trait of report.traits"> {{ formatJsonObject(trait) }} </li>
        </ul>
    </div>
    <div class="strengths-container">
        <p>{{ report.strengths }}</p>
    </div>
    <div class="challenges-container">
        <p>{{ report.challenges }}</p>
    </div>
    <div class="recommendations-container">
        <ul>
            <li *ngFor="let rec of report.recommendations"> {{ formatJsonObject(rec) }} </li>
        </ul>
    </div>
    <div class="questions-container">
        <ul>
            <li *ngFor="let question of report.questions"> {{ formatJsonObject(question) }} </li>
        </ul>
    </div>
</div>
